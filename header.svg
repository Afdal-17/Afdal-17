<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lobster&amp;display=swap');
      
      .title {
        font-family: 'Lobster', cursive, sans-serif;
        font-size: 55px;
        fill: #ffffff;
        text-anchor: middle;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 18px;
        fill: #e2e8f0;
        text-anchor: middle;
        font-weight: 500;
        letter-spacing: 1px;
      }
      @keyframes twinkle {
        0% { opacity: 0.1; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0.1; transform: scale(0.8); }
      }
      .star { animation: twinkle 3s infinite alternate; fill: #ffffff; }
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: 0.5s; }
      .s3 { animation-delay: 1s; }
      .s4 { animation-delay: 1.5s; }
      .s5 { animation-delay: 2s; }
      .s6 { animation-delay: 2.5s; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
    <clipPath id="waveClip">
      <!-- The main bounding wave that cuts off the bottom -->
      <path d="M 0,160 C 200,210 600,110 800,160 C 1000,210 1400,110 1600,160 L 1600,0 L 0,0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="5s" repeatCount="indefinite" />
      </path>
    </clipPath>
  </defs>

  <g clip-path="url(#waveClip)">
    <rect width="800" height="200" fill="url(#bg)" />

    <!-- A translucent wave layer for a liquid parallax effect -->
    <path d="M 0,140 C 200,90 600,190 800,140 C 1000,90 1400,190 1600,140 L 1600,200 L 0,200 Z" fill="rgba(255,255,255,0.15)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="7s" repeatCount="indefinite" />
    </path>

    <g>
      <circle cx="80" cy="40" r="2" class="star s1" />
      <circle cx="150" cy="120" r="1.5" class="star s2" />
      <circle cx="250" cy="30" r="2" class="star s3" />
      <circle cx="350" cy="130" r="1.5" class="star s4" />
      <circle cx="450" cy="50" r="2.5" class="star s5" />
      <circle cx="550" cy="140" r="1.5" class="star s6" />
      <circle cx="650" cy="60" r="2" class="star s1" />
      <circle cx="750" cy="110" r="1.5" class="star s2" />
      <circle cx="700" cy="20" r="2" class="star s3" />
      <circle cx="100" cy="100" r="1" class="star s4" />
      <circle cx="300" cy="80" r="1.5" class="star s5" />
      <circle cx="500" cy="90" r="1" class="star s6" />
    </g>
  </g>

  <!-- Text elements -->
  <text x="400" y="100" class="title">Hello World! 👋</text>
  <text x="400" y="145" class="subtitle">Welcome to my GitHub Profile</text>
</svg>
